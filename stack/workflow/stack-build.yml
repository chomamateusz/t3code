name: Stack build

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build and release even if the newest stack release used the same upstream and stack commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stack-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
  UPSTREAM_REPOSITORY: pingdotgg/t3code
  STACK_BRANCH: local/stack
  TOOL_NODE_VERSION: "26.12.1"

jobs:
  prepare:
    name: Prepare source
    if: github.repository == 'chomamateusz/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      skip_reason: ${{ steps.skip.outputs.skip_reason }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      series_date: ${{ steps.version.outputs.series_date }}
      build_number: ${{ steps.version.outputs.build_number }}
      upstream_sha: ${{ steps.refs.outputs.upstream_sha }}
      stack_sha: ${{ steps.refs.outputs.stack_sha }}
      source_tree: ${{ steps.apply.outputs.tree }}
      workflow_drift: ${{ steps.drift.outputs.drift }}
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.STACK_BRANCH }}
          path: local-stack
          persist-credentials: false

      # actions/checkout fails on this ref: it carries upstream's .repos gitlinks without a .gitmodules entry.
      - name: Fetch the installed workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p installed/.github/workflows
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/stack-build.yml?ref=${GITHUB_SHA}" \
            -H "Accept: application/vnd.github.raw" > installed/.github/workflows/stack-build.yml

      - name: Compare the installed workflow with its source
        id: drift
        run: |
          if cmp -s installed/.github/workflows/stack-build.yml local-stack/stack/workflow/stack-build.yml; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Workflow drift::.github/workflows/stack-build.yml on ${GITHUB_REF_NAME} differs from stack/workflow/stack-build.yml on ${STACK_BRANCH}. Install the stack branch copy."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tool Node.js
        run: bash local-stack/stack/ci/fetch-node.sh "$TOOL_NODE_VERSION" "$RUNNER_TEMP/tool-node" >> "$GITHUB_PATH"

      - name: Resolve commits
        id: refs
        run: |
          upstream_sha=$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "upstream_sha=$upstream_sha"
            echo "stack_sha=$(git -C local-stack rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease}' > "$RUNNER_TEMP/upstream-releases.jsonl"
          git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" > "$RUNNER_TEMP/fork-tags.txt"
          node local-stack/stack/ci/resolve-version.ts \
            --upstream-releases "$RUNNER_TEMP/upstream-releases.jsonl" \
            --fork-tags "$RUNNER_TEMP/fork-tags.txt" \
            --series-date "$(cat local-stack/stack/series-date)" \
            --github-output

      - name: Decide whether to build
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force == true }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
          STACK_SHA: ${{ steps.refs.outputs.stack_sha }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,isDraft,publishedAt,createdAt > "$RUNNER_TEMP/fork-releases.json"
          newest=$(node local-stack/stack/ci/should-skip.ts newest --releases "$RUNNER_TEMP/fork-releases.json")
          manifest=()
          if [[ -n "$newest" ]] && gh release download "$newest" -R "$GITHUB_REPOSITORY" \
            -p build-manifest.json -D "$RUNNER_TEMP/newest-release"; then
            manifest=(--manifest "$RUNNER_TEMP/newest-release/build-manifest.json")
          fi
          node local-stack/stack/ci/should-skip.ts decide "${manifest[@]}" \
            --upstream-sha "$UPSTREAM_SHA" --stack-sha "$STACK_SHA" --force "$FORCE" --github-output

      - name: Check the version is newer than every stack tag
        if: steps.skip.outputs.skip != 'true'
        run: |
          node local-stack/stack/ci/resolve-version.ts \
            --upstream-releases "$RUNNER_TEMP/upstream-releases.jsonl" \
            --fork-tags "$RUNNER_TEMP/fork-tags.txt" \
            --series-date "$(cat local-stack/stack/series-date)" \
            --require-newer

      - name: Report skip
        if: steps.skip.outputs.skip == 'true'
        env:
          REASON: ${{ steps.skip.outputs.skip_reason }}
        run: echo "::notice title=Nothing to build::$REASON"

      - name: Apply the series
        id: apply
        if: steps.skip.outputs.skip != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          mkdir -p results
          bash local-stack/stack/ci/fetch-upstream.sh "$UPSTREAM_URL" "$UPSTREAM_SHA" source
          bash local-stack/stack/ci/apply-series.sh local-stack/stack source results/apply-result.json
          echo "tree=$(jq -r .tree results/apply-result.json)" >> "$GITHUB_OUTPUT"

      - name: Upload apply result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apply-result
          overwrite: true
          path: results/apply-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Pack applied source
        if: steps.skip.outputs.skip != 'true'
        run: tar -C source -czf source.tar.gz .

      - name: Upload applied source
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source
          overwrite: true
          path: source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  macos_signing:
    name: Check the macOS signing secrets
    if: github.repository == 'chomamateusz/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - name: Check the macOS signing secrets
        id: check
        env:
          CERT_P12_BASE64: ${{ secrets.STACK_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.STACK_MACOS_CERT_PASSWORD }}
        run: |
          if [[ -n "$CERT_P12_BASE64" && -n "$CERT_PASSWORD" ]]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CERT_P12_BASE64" && -z "$CERT_PASSWORD" ]]; then
            echo "::notice title=No macOS build::STACK_MACOS_CERT_P12_BASE64 and STACK_MACOS_CERT_PASSWORD are not set; the release carries only the Linux x64 runtime."
            echo "signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=macOS signing secrets::Only one of STACK_MACOS_CERT_P12_BASE64 and STACK_MACOS_CERT_PASSWORD is set. Set both or neither." >&2
            exit 1
          fi

  quality:
    name: Quality checks
    needs: [prepare]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  test:
    name: Tests
    needs: [prepare]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  test_web:
    name: Web tests
    needs: [prepare]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: |
          pattern=$(node "$GITHUB_WORKSPACE/local-stack/stack/ci/test-exclusions.ts" @t3tools/web)
          args=()
          if [[ -n "$pattern" ]]; then args+=(--testNamePattern "$pattern"); fi
          vp run --filter @t3tools/web test "${args[@]}"

      - name: Boot the built web client
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  test_server:
    name: Server tests ${{ matrix.shard }}
    needs: [prepare]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          pattern=$(node "$GITHUB_WORKSPACE/local-stack/stack/ci/test-exclusions.ts" t3)
          args=(--shard "$SHARD/$SHARD_TOTAL")
          if [[ -n "$pattern" ]]; then args+=(--testNamePattern "$pattern"); fi
          vp run --filter t3 test "${args[@]}"

  build_linux_x64:
    name: Build Linux x64 runtime
    needs: [prepare, quality, test, test_web, test_server]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Download applied source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source
          path: input

      # The build needs more disk than a hosted runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build in ubuntu:22.04
        id: build
        run: |
          mkdir -p output
          docker pull --platform linux/amd64 ubuntu:22.04
          docker image inspect ubuntu:22.04 --format '{{json .RepoDigests}}'
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD/local-stack/stack/ci,dst=/ci,readonly" \
            --mount "type=bind,src=$PWD/input,dst=/input,readonly" \
            --mount "type=bind,src=$PWD/output,dst=/output" \
            ubuntu:22.04 bash /ci/container-build.sh "$VERSION" "$SOURCE_TREE"
          (cd output && sha256sum -c SHA256SUMS)
          archive_sha256=$(sha256sum "output/t3-$VERSION-linux-x64.tar.gz" | cut -d' ' -f1)
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64-runtime
          overwrite: true
          path: |
            output/t3-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload acceptance probe inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64-probe
          overwrite: true
          path: |
            output/server-bundle.tar.gz
            output/provenance.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64-build-logs
          overwrite: true
          path: output/logs
          if-no-files-found: ignore
          retention-days: 30

  accept_linux_x64:
    name: Accept Linux x64 on ubuntu:${{ matrix.ubuntu }}
    needs: [prepare, build_linux_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Download runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x64-runtime
          path: artifacts

      - name: Download acceptance probe inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x64-probe
          path: probe-input

      - name: Prepare probe
        run: |
          node_version=$(sed -n 's/^NODE=v//p' probe-input/provenance.txt)
          node_bin=$(bash local-stack/stack/ci/fetch-node.sh "$node_version" "$RUNNER_TEMP/probe-node")
          mkdir probe
          mv "$(dirname "$node_bin")" probe/node
          tar -xzf probe-input/server-bundle.tar.gz -C probe

      - name: Accept in a fresh ubuntu:${{ matrix.ubuntu }} container
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UBUNTU: ${{ matrix.ubuntu }}
        run: bash local-stack/stack/ci/run-acceptance.sh "$UBUNTU" artifacts probe "verification/ubuntu-$UBUNTU" "$VERSION"

      - name: Upload acceptance transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64-acceptance-ubuntu-${{ matrix.ubuntu }}
          overwrite: true
          path: verification
          if-no-files-found: ignore
          retention-days: 30

  build_macos_arm64:
    name: Build macOS arm64 app
    needs: [prepare, macos_signing, quality, test, test_web, test_server]
    if: needs.macos_signing.outputs.signing == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      stage: ${{ steps.unsigned.outputs.stage }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Build the unsigned app
        id: unsigned
        working-directory: source
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_ALLOWED_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_RELEASE_REPOSITORY: ${{ github.repository }}
          T3CODE_TELEMETRY_CHANNEL: dev
          T3CODE_TELEMETRY_ENABLED: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          export TMPDIR="$RUNNER_TEMP/desktop-tmp"
          mkdir "$TMPDIR"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "$VERSION" --keep-stage --verbose --output-dir "$RUNNER_TEMP/desktop-unsigned"
          shopt -s nullglob
          stages=("$TMPDIR"/t3code-desktop-mac-stage-*/app)
          [[ ${#stages[@]} -eq 1 ]]
          apps=("${stages[0]}"/dist/mac*/*.app)
          [[ ${#apps[@]} -eq 1 ]]
          mkdir "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/stage"
          tar -C "$(dirname "${apps[0]}")" -cf "$RUNNER_TEMP/unsigned/app.tar" "$(basename "${apps[0]}")"
          rm -rf "${stages[0]}/dist"
          tar -C "$(dirname "${stages[0]}")" -cf "$RUNNER_TEMP/stage/stage.tar" app
          echo "stage=${stages[0]}" >> "$GITHUB_OUTPUT"

      # Archives keep the bundle's symlinks and modes, which the artifact service drops.
      - name: Upload the unsigned app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-unsigned
          overwrite: true
          path: ${{ runner.temp }}/unsigned/app.tar
          if-no-files-found: error
          retention-days: 3

      - name: Upload the electron-builder stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-stage
          overwrite: true
          path: ${{ runner.temp }}/stage/stage.tar
          if-no-files-found: error
          retention-days: 3

  # A job that references a secret holds it for every step, so this job runs only pinned actions and its own inline steps.
  build_macos_arm64_signed:
    name: Sign macOS arm64 app
    needs: [prepare, build_macos_arm64]
    runs-on: macos-26
    timeout-minutes: 20
    env:
      SIGNING_CONFIG: local-stack/stack/ci/macos-signing.json
      SIGNING_CERT: local-stack/stack/ci/macos-signing-cert.pem
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Download the unsigned app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Unpack the unsigned app
        id: unpack
        run: |
          mkdir "$RUNNER_TEMP/macos-app"
          tar -C "$RUNNER_TEMP/macos-app" -xf "$RUNNER_TEMP/unsigned/app.tar"
          rm -r "$RUNNER_TEMP/unsigned"
          shopt -s nullglob
          apps=("$RUNNER_TEMP"/macos-app/*.app)
          [[ ${#apps[@]} -eq 1 ]]
          echo "app=${apps[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign the app
        env:
          STACK_MACOS_CERT_P12_BASE64: ${{ secrets.STACK_MACOS_CERT_P12_BASE64 }}
          STACK_MACOS_CERT_PASSWORD: ${{ secrets.STACK_MACOS_CERT_PASSWORD }}
          APP: ${{ steps.unpack.outputs.app }}
        run: |
          leaf=$(jq -r .leafSha1 "$SIGNING_CONFIG")
          [[ "$leaf" =~ ^[0-9a-f]{40}$ ]]
          work="$RUNNER_TEMP/stack-signing"
          keychain="$work/signing.keychain-db"
          secret="$work/secret.p12"
          identity="$work/identity.p12"
          umask 077
          mkdir "$work"
          keychain_password=$(/usr/bin/openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$work"' EXIT
          printf '%s' "$STACK_MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$secret"
          if (( $(wc -c < "$secret") < 1024 )); then
            echo "::error title=macOS signing::STACK_MACOS_CERT_P12_BASE64 decodes to less than 1 kB, too small for a .p12 with a private key. Set it again from the base64 of the .p12, and check the two secrets are not swapped." >&2
            exit 1
          fi
          # A Keychain Access export of the key alone carries no certificate, and security imports nothing from it.
          # The system openssl writes the old .p12 ciphers that security reads.
          if ! /usr/bin/openssl pkcs12 -in "$secret" -passin env:STACK_MACOS_CERT_PASSWORD -nocerts -nodes \
            | P12_PASSWORD="$keychain_password" /usr/bin/openssl pkcs12 -export -inkey /dev/stdin -in "$SIGNING_CERT" -passout env:P12_PASSWORD -out "$identity"; then
            echo "::error title=macOS signing::STACK_MACOS_CERT_P12_BASE64 is not a .p12 that STACK_MACOS_CERT_PASSWORD opens, or its private key does not belong to the signing certificate." >&2
            exit 1
          fi
          rm -f "$secret"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$identity" -k "$keychain" -f pkcs12 -P "$keychain_password" -T /usr/bin/codesign
          rm -f "$identity"
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null; then
            echo "::error title=macOS signing::The signing identity put no private key into the keychain. Certificates it did import:" >&2
            security find-certificate -a -Z "$keychain" | grep -E '^SHA-1 hash:|"labl"' >&2 || echo "none" >&2
            exit 1
          fi
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry=${entry#"${entry%%[![:space:]]*}"}
            entry=${entry#\"}
            entry=${entry%\"}
            if [[ -n "$entry" ]]; then search_list+=("$entry"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          # Without -v: the self-signed identity is untrusted on the runner, and codesign needs no trust to sign.
          identities=$(security find-identity -p codesigning "$keychain")
          if ! grep -qiE "\) $leaf \"" <<< "$identities"; then
            echo "::error title=macOS signing::The signing secret holds no code signing identity with certificate SHA-1 $leaf. Identities found:" >&2
            grep -E '^ +[0-9]+\) ' <<< "$identities" >&2 || true
            exit 1
          fi
          codesign --force --deep --timestamp=none --keychain "$keychain" --sign "$leaf" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP"

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/stack-signing/signing.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/stack-signing"
          if security list-keychains -d user | grep -qF "$keychain"; then
            echo "::error::The signing keychain is still in the search list" >&2
            exit 1
          fi

      - name: Pack the signed app
        env:
          APP: ${{ steps.unpack.outputs.app }}
        run: |
          mkdir "$RUNNER_TEMP/signed"
          tar -C "$(dirname "$APP")" -cf "$RUNNER_TEMP/signed/app.tar" "$(basename "$APP")"

      - name: Upload the signed app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-signed
          overwrite: true
          path: ${{ runner.temp }}/signed/app.tar
          if-no-files-found: error
          retention-days: 3

  build_macos_arm64_packaged:
    name: Package macOS arm64 app
    needs: [prepare, build_macos_arm64, build_macos_arm64_signed]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGE: ${{ needs.build_macos_arm64.outputs.stage }}
    steps:
      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Set up the applied source
        uses: ./local-stack/stack/ci/actions/setup-source
        with:
          tree: ${{ needs.prepare.outputs.source_tree }}

      - name: Download the electron-builder stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-stage
          path: ${{ runner.temp }}/stage

      - name: Download the signed app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-signed
          path: ${{ runner.temp }}/signed

      - name: Unpack the stage and the signed app
        id: unpack
        run: |
          [[ "$STAGE" =~ ^"$RUNNER_TEMP"/desktop-tmp/t3code-desktop-mac-stage-[^/]+/app$ ]]
          mkdir -p "$(dirname "$STAGE")" "$RUNNER_TEMP/macos-app"
          tar -C "$(dirname "$STAGE")" -xf "$RUNNER_TEMP/stage/stage.tar"
          tar -C "$RUNNER_TEMP/macos-app" -xf "$RUNNER_TEMP/signed/app.tar"
          shopt -s nullglob
          apps=("$RUNNER_TEMP"/macos-app/*.app)
          [[ ${#apps[@]} -eq 1 ]]
          echo "app=${apps[0]}" >> "$GITHUB_OUTPUT"

      # Signing changes the app after electron-builder hashed it into latest-mac.yml, so the signed app is packaged again.
      - name: Package the signed app
        working-directory: source
        env:
          APP: ${{ steps.unpack.outputs.app }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          vp exec --filter @t3tools/desktop -- electron-builder --projectDir "$STAGE" --mac --arm64 --publish never --prepackaged "$APP"
          mkdir "$RUNNER_TEMP/macos-release"
          shopt -s nullglob
          for file in "$STAGE"/dist/*.zip "$STAGE"/dist/*.dmg "$STAGE"/dist/*.blockmap "$STAGE"/dist/latest-mac.yml; do
            cp "$file" "$RUNNER_TEMP/macos-release/"
          done
          ls -l "$RUNNER_TEMP/macos-release"

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-release
          overwrite: true
          path: ${{ runner.temp }}/macos-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # Packaging ran source code that could rewrite anything on its runner, so the files are checked on a runner it never touched.
  build_macos_arm64_verified:
    name: Verify macOS arm64 app
    needs: [prepare, build_macos_arm64_packaged]
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sums_sha256: ${{ steps.digest.outputs.sums_sha256 }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-release
          path: ${{ runner.temp }}/macos-release

      - name: Record the checksums
        id: digest
        run: |
          mkdir "$RUNNER_TEMP/macos-sums"
          (cd "$RUNNER_TEMP/macos-release" && shasum -a 256 -- *) > "$RUNNER_TEMP/macos-sums/SHA256SUMS"
          cat "$RUNNER_TEMP/macos-sums/SHA256SUMS"
          echo "sums_sha256=$(shasum -a 256 "$RUNNER_TEMP/macos-sums/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out the stack branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha }}
          path: local-stack
          persist-credentials: false

      - name: Install tool Node.js
        run: bash local-stack/stack/ci/fetch-node.sh "$TOOL_NODE_VERSION" "$RUNNER_TEMP/tool-node" >> "$GITHUB_PATH"

      - name: Verify the release files
        run: |
          node local-stack/stack/ci/verify-macos-release.ts --dir "$RUNNER_TEMP/macos-release" \
            --version "$VERSION" --config local-stack/stack/ci/macos-signing.json --work "$RUNNER_TEMP/macos-verify"

      - name: Upload the checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-sums
          overwrite: true
          path: ${{ runner.temp }}/macos-sums/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish fork release
    needs: [prepare, macos_signing, build_linux_x64, accept_linux_x64, build_macos_arm64_verified]
    if: >-
      !cancelled()
      && needs.build_linux_x64.result == 'success'
      && needs.accept_linux_x64.result == 'success'
      && (needs.build_macos_arm64_verified.result == 'success'
        || (needs.build_macos_arm64_verified.result == 'skipped' && needs.macos_signing.outputs.signing == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      STACK_SHA: ${{ needs.prepare.outputs.stack_sha }}
      SERIES_DATE: ${{ needs.prepare.outputs.series_date }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      ARCHIVE_SHA256: ${{ needs.build_linux_x64.outputs.archive_sha256 }}
      MACOS: ${{ needs.build_macos_arm64_verified.result == 'success' }}
      MACOS_SUMS_SHA256: ${{ needs.build_macos_arm64_verified.outputs.sums_sha256 }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-x64-runtime
          path: linux-runtime

      - name: Check the runtime against the build
        run: |
          archive="t3-$VERSION-linux-x64.tar.gz"
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual=$(sha256sum "linux-runtime/$archive" | cut -d' ' -f1)
          if [[ "$actual" != "$ARCHIVE_SHA256" ]]; then
            echo "::error::$archive has sha256 $actual, the build job produced $ARCHIVE_SHA256" >&2
            exit 1
          fi
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | cmp - linux-runtime/SHA256SUMS
          mkdir release-assets
          mv "linux-runtime/$archive" release-assets/

      - name: Download macOS app
        if: env.MACOS == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-release
          path: macos-app

      - name: Download the verified macOS checksums
        if: env.MACOS == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-sums
          path: macos-app

      - name: Check the macOS app against the verification
        if: env.MACOS == 'true'
        run: |
          actual=$(sha256sum macos-app/SHA256SUMS | cut -d' ' -f1)
          if [[ ! "$MACOS_SUMS_SHA256" =~ ^[0-9a-f]{64}$ || "$actual" != "$MACOS_SUMS_SHA256" ]]; then
            echo "::error::macOS SHA256SUMS has sha256 $actual, the verification job recorded ${MACOS_SUMS_SHA256:-nothing}" >&2
            exit 1
          fi
          listed=$(awk '{ print $2 }' macos-app/SHA256SUMS | LC_ALL=C sort)
          present=$(find macos-app -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort)
          if [[ "$listed" != "$present" ]]; then
            echo "::error::The macOS artifact holds [${present//$'\n'/, }], its SHA256SUMS lists [${listed//$'\n'/, }]" >&2
            exit 1
          fi
          prefix="T3-Code-$VERSION-arm64"
          while read -r name; do
            case "$name" in
              "$prefix.zip" | "$prefix.zip.blockmap" | "$prefix.dmg" | "$prefix.dmg.blockmap" | latest-mac.yml) ;;
              *)
                echo "::error::Unexpected macOS release file $name" >&2
                exit 1
                ;;
            esac
          done <<< "$listed"
          for required in "$prefix.zip" "$prefix.zip.blockmap" "$prefix.dmg" latest-mac.yml; do
            grep -qxF "$required" <<< "$listed"
          done
          (cd macos-app && sha256sum --check --strict SHA256SUMS)
          grep -qxE "version: '?${VERSION//./\\.}'?" macos-app/latest-mac.yml
          while read -r name; do mv "macos-app/$name" release-assets/; done <<< "$listed"

      - name: Write checksums and build manifest
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-local\.stack\.[0-9]{8}\.[1-9][0-9]*$ ]]
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERIES_DATE" =~ ^[0-9]{8}$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          archive="t3-$VERSION-linux-x64.tar.gz"
          (cd release-assets && export LC_ALL=C && sha256sum -- *) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" release-assets/SHA256SUMS
          grep -qxF "$ARCHIVE_SHA256  $archive" release-assets/SHA256SUMS
          macos=null
          if [[ "$MACOS" == "true" ]]; then
            macos=$(jq -Rn --arg archive "$archive" \
              '{assets: [inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$") | select(.name != $archive) | {name, sha256}]}' \
              release-assets/SHA256SUMS)
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg upstreamSha "$UPSTREAM_SHA" \
            --arg stackSha "$STACK_SHA" \
            --arg seriesDate "$SERIES_DATE" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --arg runUrl "$RUN_URL" \
            --argjson macos "$macos" \
            '{version: $version, upstreamSha: $upstreamSha, stackSha: $stackSha, seriesDate: $seriesDate, buildNumber: $buildNumber, runUrl: $runUrl}
              + (if $macos == null then {} else {macos: $macos} end)' \
            > release-assets/build-manifest.json
          cat release-assets/SHA256SUMS release-assets/build-manifest.json

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tag_commit=$(awk -v ref="refs/tags/$TAG" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : direct) }' <<< "$refs")
          if [[ -z "$tag_commit" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$tag_commit" != "$STACK_SHA" ]]; then
            echo "::error::Tag $TAG points at commit $tag_commit, this run built stack commit $STACK_SHA" >&2
            exit 1
          fi
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"); then
            echo "::error::Tag $TAG exists on $STACK_SHA without a published release" >&2
            exit 1
          fi
          assets=$(jq -r '[.assets[].name] | sort | join(", ")' <<< "$release")
          expected=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | jq -Rrn '[inputs] | sort | join(", ")')
          if [[ "$assets" != "$expected" ]]; then
            echo "::error::Release $TAG carries assets [$assets], expected exactly [$expected]" >&2
            exit 1
          fi
          existing="$RUNNER_TEMP/existing-release"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$existing"
          differences=$(jq -r -s --arg version "$VERSION" --arg upstreamSha "$UPSTREAM_SHA" --arg stackSha "$STACK_SHA" \
            'if length == 1 and (.[0] | type) == "object" then .[0] else error("not one object") end | . as $manifest | $ARGS.named | to_entries[] | select($manifest[.key] != .value) | "build-manifest.json \(.key) is \($manifest[.key] | tojson), this run has \(.value)"' \
            "$existing/build-manifest.json") || differences="build-manifest.json is not a JSON object"
          if ! cmp -s "$existing/SHA256SUMS" release-assets/SHA256SUMS; then
            differences+=$'\n'"SHA256SUMS is $(jq -Rsc . "$existing/SHA256SUMS"), this run has $(jq -Rsc . release-assets/SHA256SUMS)"
          elif ! (cd "$existing" && sha256sum --check --quiet SHA256SUMS); then
            differences+=$'\n'"published assets do not match this run's SHA256SUMS"
          fi
          differences=$(sed '/^$/d' <<< "$differences")
          if [[ -n "$differences" ]]; then
            echo "::error::Release $TAG already exists with a different build: ${differences//$'\n'/; }" >&2
            exit 1
          fi
          echo "::notice title=Already published::$TAG is published from the same commits and assets; nothing to do."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.existing.outputs.published == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      # A draft is invisible to updaters until every asset is attached.
      - name: Publish release
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases"
          draft_ids() {
            gh api --paginate "$releases?per_page=100" | jq -r --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag) | .id'
          }
          leftover=$(draft_ids)
          for id in $leftover; do
            echo "Deleting leftover draft release $id for $TAG"
            gh api -X DELETE "$releases/$id"
          done
          built="Linux x64 runtime"
          if [[ "$MACOS" == "true" ]]; then built+=" and macOS arm64 app (signed with the fork's own certificate, not notarized)"; fi
          {
            echo "$built built by [stack build]($RUN_URL)."
            echo
            echo "- upstream: [\`$UPSTREAM_SHA\`](https://github.com/$UPSTREAM_REPOSITORY/commit/$UPSTREAM_SHA)"
            echo "- stack: [\`$STACK_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$STACK_SHA)"
            echo "- series date: $SERIES_DATE, build $BUILD_NUMBER"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease \
            --target "$STACK_SHA" --title "T3 Code $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            release-assets/*
          id=$(draft_ids)
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected exactly one draft release for $TAG, found: ${id//$'\n'/ }" >&2
            exit 1
          fi
          published=$(gh api -X PATCH "$releases/$id" -F draft=false)
          jq '{url: .html_url, tag: .tag_name, draft, prerelease, assets: [.assets[].name]}' <<< "$published"
          jq -e --arg tag "$TAG" '.draft == false and .prerelease == true and .tag_name == $tag' <<< "$published" > /dev/null

  report:
    name: Report
    if: always() && github.repository == 'chomamateusz/t3code'
    needs: [prepare, macos_signing, quality, test, test_web, test_server, build_linux_x64, accept_linux_x64, build_macos_arm64, build_macos_arm64_signed, build_macos_arm64_packaged, build_macos_arm64_verified, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the stack branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.stack_sha || env.STACK_BRANCH }}
          path: local-stack
          persist-credentials: false

      - name: Install tool Node.js
        id: tool_node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        run: bash local-stack/stack/ci/fetch-node.sh "$TOOL_NODE_VERSION" "$RUNNER_TEMP/tool-node" >> "$GITHUB_PATH"

      - name: Download apply result
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apply-result
          path: results

      - name: Classify run
        id: classify
        if: steps.tool_node.outcome == 'success'
        continue-on-error: true
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node local-stack/stack/ci/classify-run.ts --needs "$RUNNER_TEMP/needs.json" \
            --apply-result results/apply-result.json --run-url "$RUN_URL" \
            --output stack-result.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Write the run result without the report tooling
        if: always() && steps.classify.outcome != 'success'
        run: |
          echo "::warning title=Report fallback::The report tooling could not run; writing stack-result.json from the needs context."
          apply=null
          if [[ -f results/apply-result.json ]] && jq -e 'type == "object"' results/apply-result.json >/dev/null 2>&1; then
            apply=$(cat results/apply-result.json)
          fi
          jq -n --argjson needs "$NEEDS" --argjson applyResult "$apply" --arg runUrl "$RUN_URL" '
            def stage_of: if . == "macos_signing" then "prepare" elif . == "prepare" or . == "release" then . elif startswith("build_") then "build" elif startswith("accept_") then "accept" else "test" end;
            def earliest: map(stage_of) as $stages | ["prepare", "test", "build", "accept", "release"] | map(select(. as $stage | $stages | index($stage))) | first;
            def jobs_with($result): $needs | to_entries | map(select(.value.result == $result) | .key);
            ($needs.prepare.outputs // {}) as $outputs
            | ($needs.macos_signing.outputs.signing // "") as $signing
            | def output($key): $outputs[$key] | if type == "string" and . != "" then . else null end;
            def passed: .value.result == "success" or (.value.result == "skipped" and (.key | startswith("build_macos_")) and $signing != "true");
            jobs_with("failure") as $failed
            | jobs_with("cancelled") as $cancelled
            | (if ($failed | length) > 0 then {status: "failed", stage: ($failed | earliest), reason: null}
               elif ($cancelled | length) > 0 then {status: "cancelled", stage: ($cancelled | earliest), reason: null}
               elif $needs.prepare.result == "skipped" then {status: "skipped", stage: null, reason: "prepare did not run in this repository"}
               elif $outputs.skip == "true" then {status: "skipped", stage: null, reason: output("skip_reason")}
               elif ($needs | to_entries | all(passed)) then {status: "success", stage: null, reason: null}
               else {status: "failed", stage: ($needs | to_entries | map(select(passed | not) | .key) | earliest), reason: "a required job did not run"}
               end) as $run
            | (if $run.stage == "prepare" and $applyResult.status == "failed" then "apply" else $run.stage end) as $stage
            | {
                status: $run.status,
                stage: $stage,
                reason: ([$run.reason, "the report tooling could not run; this result was written by the workflow fallback"] | map(select(. != null)) | join("; ")),
                failedJobs: $failed,
                cancelledJobs: $cancelled,
                version: output("version"),
                tag: output("tag"),
                upstreamSha: output("upstream_sha"),
                stackSha: output("stack_sha"),
                seriesDate: output("series_date"),
                buildNumber: output("build_number"),
                workflowDrift: ($outputs.workflow_drift == "true"),
                macosSigning: ($signing == "true"),
                runUrl: $runUrl,
                apply: (if $stage == "apply" then $applyResult else null end)
              }' > stack-result.json
          cat stack-result.json
          jq -r '"## Stack build: \(.status)\(if .stage then " at stage `\(.stage)`" else "" end)\n\n\(.reason)"' stack-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stack-result
